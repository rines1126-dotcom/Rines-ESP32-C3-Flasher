
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "tools platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v5

      - name: Version for this run
        run: |
          echo "ESPFLASHER_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "ESPFLASHER_VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Prepare release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rines-esp32-release.jks"
          echo "ESPFLASHER_KEYSTORE=$RUNNER_TEMP/rines-esp32-release.jks" >> "$GITHUB_ENV"
          echo "ESPFLASHER_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ESPFLASHER_KEY_ALIAS=rines-esp32" >> "$GITHUB_ENV"
          echo "ESPFLASHER_KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Show SHA-1 fingerprint
        run: ./gradlew :app:signingReport

      - uses: actions/upload-artifact@v4
        with:
          name: ESPFlasher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ESPFlasher-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0-${{ github.run_number }}
          name: ESP Flasher 1.0.${{ github.run_number }} (signed APK)
          body: |
            Signed release APK from GitHub Actions (1.0.${{ github.run_number }}).
            Package: `espflasher.shizoghost.com`
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
